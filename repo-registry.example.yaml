# Global MCP servers — available to all repos (repo-level overrides by name)
# mcp_servers:
#   github-notifications:
#     transport: stdio
#     command: npx
#     args: ["-y", "@anthropic/github-mcp-server"]
#     env:
#       GITHUB_TOKEN: "${GITHUB_TOKEN}"

repos:
  my-app:
    clone: "git@github.com:yourorg/my-app.git"
    default_branch: "main"
    detect:
      keywords: ["my-app", "frontend", "react", "ui"]
    commands:
      lint: ["npm", "run", "lint"]
      test_fast: ["npm", "test", "--", "--watchAll=false"]
      test_full: ["npm", "test", "--", "--watchAll=false", "--coverage"]
    pr:
      reviewers_default: ["alice", "bob"]
    ci:
      provider: "github_actions"

  my-api:
    clone: "git@github.com:yourorg/my-api.git"
    default_branch: "main"
    detect:
      keywords: ["my-api", "backend", "api", "server", "endpoint"]
    commands:
      lint: ["npm", "run", "lint"]
      test_fast: ["npm", "test"]
      test_full: ["npm", "run", "test:full"]
    pr:
      reviewers_default: ["charlie"]
    ci:
      provider: "github_actions"
    max_worktrees: 2          # concurrent worktree slots (default: 1)
    clean_mode: "light"       # "light" preserves .gitignore'd build caches; "full" cleans everything

    # Per-repo MCP servers (merged with global; repo-level overrides by name)
