<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Son of Steve</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #0f1117; --bg2: #1a1d27; --bg3: #252830;
        --fg: #e1e4ed; --fg2: #9ca3b0; --fg3: #6b7280;
        --accent: #6366f1; --accent2: #818cf8;
        --green: #22c55e; --red: #ef4444; --yellow: #eab308; --blue: #3b82f6;
        --border: #2d3140; --radius: 8px;
      }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--fg); line-height: 1.5; }
      a { color: var(--accent2); text-decoration: none; }
      a:hover { text-decoration: underline; }
      button { cursor: pointer; font-family: inherit; }
      input, select, textarea { font-family: inherit; font-size: inherit; }
      .plan-markdown h1, .plan-markdown h2, .plan-markdown h3 { margin: 12px 0 6px; color: var(--fg); }
      .plan-markdown h1 { font-size: 16px; } .plan-markdown h2 { font-size: 14px; } .plan-markdown h3 { font-size: 13px; }
      .plan-markdown p { margin: 6px 0; }
      .plan-markdown ul, .plan-markdown ol { margin: 6px 0; padding-left: 20px; }
      .plan-markdown li { margin: 3px 0; }
      .plan-markdown code { background: var(--bg3); padding: 1px 5px; border-radius: 4px; font-size: 12px; font-family: 'SF Mono', Monaco, Consolas, monospace; }
      .plan-markdown pre { background: var(--bg3); padding: 10px; border-radius: 6px; overflow-x: auto; margin: 8px 0; }
      .plan-markdown pre code { background: none; padding: 0; }
      .plan-markdown strong { color: var(--fg); }
      .plan-markdown hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
      .chat-markdown h1, .chat-markdown h2, .chat-markdown h3 { margin: 10px 0 4px; color: var(--fg); }
      .chat-markdown h1 { font-size: 15px; } .chat-markdown h2 { font-size: 14px; } .chat-markdown h3 { font-size: 13px; }
      .chat-markdown p { margin: 4px 0; }
      .chat-markdown p:first-child { margin-top: 0; }
      .chat-markdown p:last-child { margin-bottom: 0; }
      .chat-markdown ul, .chat-markdown ol { margin: 4px 0; padding-left: 18px; }
      .chat-markdown li { margin: 2px 0; }
      .chat-markdown code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 4px; font-size: 12px; font-family: 'SF Mono', Monaco, Consolas, monospace; }
      .chat-markdown pre { background: rgba(255,255,255,0.06); padding: 8px; border-radius: 6px; overflow-x: auto; margin: 6px 0; }
      .chat-markdown pre code { background: none; padding: 0; }
      .chat-markdown strong { color: var(--fg); }
      .chat-markdown a { color: var(--accent2); text-decoration: none; }
      .chat-markdown a:hover { text-decoration: underline; }
      .chat-markdown em { font-style: italic; color: var(--fg3); }
      .chat-markdown hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
